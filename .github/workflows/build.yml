name: build
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Build
        run: |
          set +e
          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(grep -E "^e: |error:|What went wrong|Could not|Caused by" build.log | head -30 | cut -c1-260)
            msg="${msg//$'\n'/%0A}"
            echo "::error title=BUILD_ERRORS::$msg"
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: VaultHD-debug
          path: app/build/outputs/apk/debug/*.apk
